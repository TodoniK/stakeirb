services:
  backend:
    build:
      context: ./packages/stakeirb-back
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    networks:
      - stakeirb-network
      - dokploy-network

  frontend:
    build:
      context: ./packages/stakeirb-front
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-}
    networks:
      - stakeirb-network
    depends_on:
      - backend

networks:
  stakeirb-network:
    driver: bridge
  dokploy-network:
    external: true
